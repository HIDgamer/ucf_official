name: "Update Changelog"
on:
  push:
    branches:
      - UCFSS13

permissions:
  contents: write

jobs:
  update-changelog:
    concurrency: changelog
    runs-on: [self-hosted, Linux, X64]
    steps:

    - name: "Check for ACTION_ENABLER secret and pass true to output if it exists to be checked by later steps"
      id: value_holder
      env:
        ENABLER_SECRET: ${{ secrets.ACTION_ENABLER }}
      run: |
        unset SECRET_EXISTS
        if [ -n "$ENABLER_SECRET" ]; then SECRET_EXISTS=true ; fi
        echo "ACTIONS_ENABLED=$SECRET_EXISTS" >> $GITHUB_OUTPUT
    - name: Set up Python
      if: steps.value_holder.outputs.ACTIONS_ENABLED
      uses: actions/setup-python@v3
      with:
        python-version: 3.8
    - name: Install dependencies
      if: steps.value_holder.outputs.ACTIONS_ENABLED
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyyaml pygithub
    - name: Checkout
      if: steps.value_holder.outputs.ACTIONS_ENABLED
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Fetch Changelog
      if: steps.value_holder.outputs.ACTIONS_ENABLED
      run: |
        python .github/ss13_fetchchangelog.py html/changelogs
      env:
        REPO: ${{ github.repository }}
    - name: Update Changelog
      if: steps.value_holder.outputs.ACTIONS_ENABLED
      run: |
        python .github/ss13_genchangelog.py html/changelogs
    - name: Commit
      if: steps.value_holder.outputs.ACTIONS_ENABLED
      run: |
        git pull origin UCFSS13
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add html/changelogs/archive
        git commit -m "Automatic changelog compile [ci skip]" -a || true
    - name: "Push"
      if: steps.value_holder.outputs.ACTIONS_ENABLED
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
